[workspace]
resolver = "3"
members = ["apps/cli", "apps/gtk", "apps/web/core", "apps/windows", "crates/core", "crates/desktop", "crates/ffi", "crates/parse", "crates/store", "crates/surface", "crates/sync"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/emassey0135/lumenna"

[workspace.dependencies]
automerge = "0.11"
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumenna-parse = { path = "crates/parse" }
lumenna-store = { path = "crates/store" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jiff = "0.2"
rrule = "0.14"
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
# 0.40 builds for the browser too, on sqlite-wasm-rs (§16.12); `bundled` applies only where
# the native SQLite is used.
rusqlite = { version = "0.40", features = ["bundled"] }
lumenna-core = { path = "crates/core" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Full debug info costs well over a gigabyte across this dependency set — `automerge` and a
# bundled SQLite dominate — which is more than /home has to spare on this machine. Line
# tables keep backtraces and panic locations readable and cut most of that. Raise it to
# `true` when a debugger is actually needed.
[profile.dev]
debug = "line-tables-only"
# Incremental state ran to 360 MB on its own, which this machine does not have to give. Full
# rebuilds of a workspace this size take under a minute; the cache was not paying for itself.
incremental = false

[profile.test]
debug = "line-tables-only"

# The web client's module (§16.12), which every visit downloads: built for size rather than
# speed, whole-program, without symbols. `npm run core` in apps/web builds with it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
