[workspace]
resolver = "3"
members = ["apps/cli", "apps/gtk", "apps/web/core", "apps/windows", "crates/app", "crates/bridge", "crates/core", "crates/ffi", "crates/parse", "crates/store", "crates/host", "crates/records", "crates/sync"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/emassey0135/lumenna"

# What Lumenna is, said once: the core reads it as it builds (`records::words::metadata`), and every
# platform's own file that must say it ahead (the desktop entry and metainfo, the MSIX and Inno
# Setup, Android's Gradle files, the web's package and manifest, the PowerShell module, BTSpeak's
# pyproject) is held to it by `records`' metadata test.
[workspace.metadata.lumenna]
name = "Lumenna"
description = "Tasks, and the time blocks you work through them in"
version = "0.1.0"
homepage = "https://github.com/emassey0135/lumenna"
issues = "https://github.com/emassey0135/lumenna/issues"
publisher = "Elijah Massey"
id = "dev.emassey0135.Lumenna"

[workspace.dependencies]
automerge = "0.11"
anstream = "0.6"
anstyle = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lumenna-parse = { path = "crates/parse" }
lumenna-store = { path = "crates/store" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jiff = "0.2"
rrule = "0.14"
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
# 0.40 builds for the browser too, on sqlite-wasm-rs; `bundled` applies only where
# the native SQLite is used.
rusqlite = { version = "0.40", features = ["bundled"] }
lumenna-core = { path = "crates/core" }
lumenna-records = { path = "crates/records" }
lumenna-host = { path = "crates/host" }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Full debug info costs well over a gigabyte across this dependency set — `automerge` and a
# bundled SQLite dominate — which is more than /home has to spare on this machine. Line
# tables keep backtraces and panic locations readable and cut most of that. Raise it to
# `true` when a debugger is actually needed.
[profile.dev]
debug = "line-tables-only"
# Incremental state ran to 360 MB on its own, which this machine does not have to give. Full
# rebuilds of a workspace this size take under a minute; the cache was not paying for itself.
incremental = false

[profile.test]
debug = "line-tables-only"

# Every app's core and `lum` as shipped: whole-program (one codegen unit, fat LTO) and without
# symbols. Measured on `lum` and the Apple core's dylib: 40.4 MB and 31.8 MB became 21.9 MB and
# 20.3 MB, and commands ran a quarter faster. Optimizing for size instead was a quarter smaller
# again but half again as slow, which a Raspberry Pi and a watch feel more than the disk does.
# Unwinding stays: the bindings turn a panic into an error rather than ending the app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# The web client's module, which every visit downloads: built for size rather than
# speed, whole-program, without symbols. `npm run core` in apps/web builds with it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
