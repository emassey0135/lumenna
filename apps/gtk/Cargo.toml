[package]
name = "lumenna-gtk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna for Linux: GTK 4, drawing the Crux app."

[[bin]]
name = "lumenna-gtk"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
# The app the screens draw (`model.rs`): its view models and events, and the device's store
# with syncing and the command surface served while this device's endpoint is held.
lumenna-app = { path = "../../crates/app" }
lumenna-ffi = { path = "../../crates/ffi", features = ["network", "rpc"] }
lumenna-records.workspace = true
# 4.14 for `gtk_accessible_announce`, which is how a change is said. GTK tells AT-SPI a tree
# item's level only from 4.16, so below that a row says its level in its text (`tree.rs`).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background", "global_shortcuts", "gtk4"] }
# The shortcuts from anywhere on X11 without the GlobalShortcuts portal: a key grab.
x11rb = { version = "0.13", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
