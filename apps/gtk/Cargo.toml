[package]
name = "lumenna-gtk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna for Linux: GTK 4, linking the command surface directly."

[[bin]]
name = "lumenna-gtk"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
lumenna-desktop = { path = "../../crates/desktop" }
lumenna-surface = { path = "../../crates/surface", features = ["rpc", "sync"] }
# 4.14 for `gtk_accessible_announce`, which is how a change is said. It builds against
# that, but reads fully only from 4.22: GTK tells AT-SPI a tree item's level from 4.16 and
# its position among its siblings from 4.22, so on Ubuntu 24.04's 4.14 every list reads flat.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "gtk4"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
