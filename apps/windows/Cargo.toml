[package]
name = "lumenna-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna for Windows: Win32, standard common controls only (§16.4)."
build = "build.rs"

[[bin]]
name = "lumenna"
path = "src/main.rs"

[dependencies]
directories.workspace = true
jiff.workspace = true
lumenna-surface = { path = "../../crates/surface", features = ["sync"] }

# Everything that touches Win32 is behind `cfg(windows)`, so the workspace still builds and
# tests on every other platform: the wording, the form and the places are tested there too.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
