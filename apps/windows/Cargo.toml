[package]
name = "lumenna-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna for Windows: Win32, standard common controls only."
build = "build.rs"

[[bin]]
name = "lumenna"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
# The Crux app, as the Mac and Android run it: an rlib here, with the network and the command
# surface a resident app serves.
lumenna-ffi = { path = "../../crates/ffi", features = ["network", "rpc"] }
# What the app's view model and lines are, and how every line reads.
lumenna-app = { path = "../../crates/app" }
# The records the app's view is made of: rows, actions, questions, settings.
lumenna-records.workspace = true

# Everything that touches Win32 is behind `cfg(windows)`, so the workspace still builds and
# tests on every other platform: the wording, the form and the places are tested there too.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    # Run as an MSIX package: its startup task, and how this process was started.
    "ApplicationModel",
    "ApplicationModel_Activation",
    # Toasts, for reminders: Windows' own notifications, which every screen reader announces
    # and Do Not Disturb holds back.
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[dev-dependencies]
# The UI tests seed and check a store of their own, as another process would.
lumenna-host = { path = "../../crates/host", features = ["sync", "rpc"] }
tempfile.workspace = true
# The icon example compresses its PNGs.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
