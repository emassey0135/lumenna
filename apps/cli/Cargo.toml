[package]
name = "lumenna-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's command-line interface. The first target, and a permanent one."

[[bin]]
name = "lum"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-store.workspace = true
lumenna-host = { path = "../../crates/host", features = ["sync", "rpc"] }
lumenna-ffi = { path = "../../crates/ffi", features = ["rpc"] }
lumenna-sync = { path = "../../crates/sync" }
iroh = "1.3"
gethostname = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde.workspace = true
serde_json.workspace = true
# `lum mcp`: the Model Context Protocol's official Rust SDK, over stdio.
rmcp = { version = "3.6", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
