[package]
name = "lumenna-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's command-line interface. The first target, and a permanent one."

[[bin]]
name = "lum"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-records.workspace = true
lumenna-store.workspace = true
lumenna-host = { path = "../../crates/host", features = ["sync", "rpc"] }
lumenna-ffi = { path = "../../crates/ffi", features = ["rpc"] }
lumenna-sync = { path = "../../crates/sync" }
iroh = { version = "1.3", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring"] }
gethostname = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde.workspace = true
serde_json.workspace = true
# `lum mcp`: the Model Context Protocol's official Rust SDK, over stdio and Streamable HTTP, which
# hyper serves (already in the build, under iroh).
rmcp = { version = "3.6", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.3"

[dev-dependencies]
tempfile.workspace = true
# `lum mcp --listen`'s tests: a real client, and requests a client would not make.
rmcp = { version = "3.6", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
# reqwest is built with rustls and no provider of its own elsewhere in the tree; ring is iroh's.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
