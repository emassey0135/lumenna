[package]
name = "lumenna-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's core for the web client: the surface, exported to JavaScript."

[lib]
# The module the browser loads, and an ordinary library so the workspace checks it natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
boltffi = "=0.31.1"
lumenna-host = { path = "../../../crates/host", features = ["sync"] }
# The screens' state, run beside the store in this worker.
lumenna-app = { path = "../../../crates/app" }
lumenna-bridge = { path = "../../../crates/bridge" }
# The app's middleware: the store's from the bridge, the network's here.
crux_core = "=0.20.0"
lumenna-records.workspace = true
# Timers on the browser's event loop, for noticing a pairing given up.
n0-future = "0.3"
# The places and wording the desktop apps share, so the web says what they say.
lumenna-desktop = { path = "../../../crates/desktop", features = ["app"] }
serde.workspace = true
jiff.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# The pairing's question about the words, answered by the person later.
futures = "0.3"
# The browser's own Intl for times and days, and the promises sync answers with.
js-sys = "0.3"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
# SQLite's own durable browser storage, OPFS through sync access handles.
sqlite-wasm-rs = { version = "0.5", default-features = false }
sqlite-wasm-vfs = "0.2"

[lints]
workspace = true
