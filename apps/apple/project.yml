# The Xcode project, generated by XcodeGen: `cd apps/apple && xcodegen`. The .xcodeproj is output,
# not source — edit this file and regenerate.
#
# The Rust core is built by build-core.sh before every build, for whichever platform Xcode
# is building, and linked as a static library. Its Swift bindings, LumennaCore.swift, are
# regenerated by the same script and compiled into the app.
name: Lumenna
options:
  bundleIdPrefix: io.github.emassey0135
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signing for a device needs the team; the simulator needs none.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3QAJ2S64Z7

targets:
  Lumenna:
    type: application
    platform: iOS
    sources:
      - path: Lumenna
      - path: Generated/bindings/LumennaCore.swift
        optional: true
        group: Generated
    preBuildScripts:
      - name: Build the Rust core
        script: '"$SRCROOT/build-core.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/bindings/LumennaCore.swift
    dependencies:
      - sdk: Security.framework
    info:
      path: Lumenna/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.emassey0135.lumenna
        TARGETED_DEVICE_FAMILY: "1,2"
        # The script writes into the source tree and runs Cargo, neither of which the
        # script sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
        OTHER_LDFLAGS: -llumenna_ffi
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        # The core is built for Apple silicon only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          RUST_PROFILE: debug
        Release:
          RUST_PROFILE: release

  LumennaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumennaUITests
    dependencies:
      - target: Lumenna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.emassey0135.lumenna.uitests
        TEST_TARGET_NAME: Lumenna
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

schemes:
  Lumenna:
    build:
      targets:
        Lumenna: all
        LumennaUITests: [test]
    test:
      targets:
        - LumennaUITests
