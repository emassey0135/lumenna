# The Xcode project, generated by XcodeGen: `cd apps/apple && xcodegen`. The .xcodeproj is output,
# not source — edit this file and regenerate.
#
# The Rust core is built by build-core.sh before every build, for whichever platform Xcode
# is building, and linked as a static library. Its Swift bindings, the Crux app's and its
# device's through BoltFFI, are regenerated by the same script and compiled into the
# LumennaApp framework, a module of its own so that its names (Locale, Action) do not shadow
# Foundation's. The framework builds first, so the script runs as its first step.
name: Lumenna
options:
  bundleIdPrefix: dev.emassey0135
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    # The first watchOS without the 32-bit watches (Ultra 1, SE 2): every watch it runs on is
    # 64-bit, as the core is built (build-core.sh).
    watchOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

# AppStore is the Mac App Store edition's: the Mac app built sandboxed, its store in its App
# Group container, without `lum` (apps/apple/CLAUDE.md, "The two Mac editions"). Release's
# settings otherwise; the phone and the watch have it too, and nothing of theirs differs.
configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Mac's targets had it off, Xcode's default for them; the force-loaded core is most of
    # what it removes.
    DEAD_CODE_STRIPPING: YES
    # Signing for a device needs the team; the simulator needs none.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3QAJ2S64Z7
    # Which Mac edition this configuration builds: build-core.sh and the Mac's phases read it.
    LUMENNA_EDITION: direct
  configs:
    AppStore:
      LUMENNA_EDITION: appstore

targetTemplates:
  # The Rust core and the Crux app's Swift, as the module LumennaApp: a dynamic framework per
  # platform, embedded in its app. The whole static library is loaded into it, so the app, its
  # tests and the framework share one core in the process: the tests linking a static
  # framework of their own would have brought a second.
  LumennaApp:
    type: framework
    preBuildScripts:
      - name: Build the Rust core
        script: '"$SRCROOT/build-core.sh"'
        basedOnDependencyAnalysis: false
        # What it makes, which the framework links and compiles: named, or Xcode looks for the
        # library and the Swift before the script has made them, as on a fresh checkout.
        outputFiles:
          - $(RUST_LIB_DIR)/liblumenna_ffi.a
          - $(APP_SWIFT)
    settings:
      base:
        PRODUCT_NAME: LumennaApp
        PRODUCT_MODULE_NAME: LumennaApp
        GENERATE_INFOPLIST_FILE: YES
        # The widget extensions link it as the apps do, so it uses only what an extension may.
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Generated code, whose own warnings are BoltFFI's.
        SWIFT_SUPPRESS_WARNINGS: YES
        # The static library, by its full path: Cargo builds a dynamic one beside it for the
        # binding generators, which the app would then load from the Mac's disk (see the apps).
        OTHER_LDFLAGS: -force_load $(RUST_LIB_DIR)/liblumenna_ffi.a
      configs:
        Debug:
          RUST_PROFILE: debug
        Release:
          RUST_PROFILE: release
        AppStore:
          RUST_PROFILE: release

  # The widgets (Widgets/, apps/apple/CLAUDE.md "The widgets"): an extension embedded in its
  # app, a process of its own, over the same LumennaApp framework the app embeds, so the core is
  # built once per platform and linked statically into that framework alone. They read the
  # glance the app writes into the App Group, and run Today's Mark Done.
  LumennaWidgets:
    type: app-extension
    sources:
      - path: Widgets
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      # Where the glance is, how it is written again after a Mark Done, and the device's clock.
      - path: Shared/AppGroup.swift
        group: Shared
      - path: Shared/GlanceFile.swift
        group: Shared
      - path: Shared/Clock.swift
        group: Shared
      - path: Shared/Words.swift
        group: Shared
      - path: Shared/Palette.swift
        group: Shared
      - path: Shared/LaunchURL.swift
        group: Shared
      # New Task's control opens the app on the core's launch, in the app (Launches.swift).
      - path: Shared/Launches.swift
        group: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # What the shared sources leave out in a widget: the app's own model, its search index.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LUMENNA_WIDGETS
        APPLICATION_EXTENSION_API_ONLY: YES

targets:
  LumennaAppiOS:
    templates: [LumennaApp]
    platform: iOS
    sources:
      - path: Generated/App/swift/LumennaFfiBoltFFI.swift
        optional: true
        group: Generated
    dependencies:
      - sdk: Security.framework
      # Iroh's network interface and path monitoring.
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        APP_SWIFT: $(SRCROOT)/Generated/App/swift/LumennaFfiBoltFFI.swift
        "RUST_LIB_DIR[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "RUST_LIB_DIR[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  LumennaAppMac:
    templates: [LumennaApp]
    platform: macOS
    sources:
      - path: Generated/App/swift/LumennaFfiBoltFFI.swift
        optional: true
        group: Generated
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        APP_SWIFT: $(SRCROOT)/Generated/App/swift/LumennaFfiBoltFFI.swift
        # Every architecture built, joined by build-core.sh: Apple silicon and Intel.
        RUST_LIB_DIR: $(SRCROOT)/../../target/universal-apple-darwin/$(RUST_PROFILE)

  LumennaAppWatch:
    templates: [LumennaApp]
    platform: watchOS
    sources:
      - path: Generated/Watch/App/swift/LumennaFfiBoltFFI.swift
        optional: true
        group: Generated
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Watch/App/include
        APP_SWIFT: $(SRCROOT)/Generated/Watch/App/swift/LumennaFfiBoltFFI.swift
        "RUST_LIB_DIR[sdk=watchsimulator*]": $(SRCROOT)/../../target/aarch64-apple-watchos-sim/$(RUST_PROFILE)
        "RUST_LIB_DIR[sdk=watchos*]": $(SRCROOT)/../../target/aarch64-apple-watchos/$(RUST_PROFILE)
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64
  Lumenna:
    type: application
    platform: iOS
    sources:
      - path: Lumenna
      - path: Shared
    postBuildScripts:
      - name: Check the core is linked in, not loaded
        basedOnDependencyAnalysis: false
        script: |
          # A reference to the Rust library as a dylib means the app looks for it on the
          # Mac's disk at launch: fine in the simulator, a crash on a phone. Fail here instead.
          for binary in "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/$EXECUTABLE_NAME.debug.dylib"; do
            [ -f "$binary" ] || continue
            if otool -L "$binary" | grep -q liblumenna_; then
              echo "error: $binary loads Cargo's dynamic library; the core must be linked statically"
              exit 1
            fi
          done
    dependencies:
      # The Crux app's Swift, which builds the core first.
      - target: LumennaAppiOS
      - sdk: Security.framework
      # Iroh's network interface and path monitoring.
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      # The widgets.
      - target: LumennaWidgetsiOS
      # The Apple Watch app, embedded as every watch app is, and its sync (WatchLink).
      - target: LumennaWatch
      - sdk: WatchConnectivity.framework
    info:
      path: Lumenna/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        # A widget opens the app on one of the core's launches: lumenna://launch/<id>
        # (Shared/LaunchURL.swift).
        CFBundleURLTypes:
          - CFBundleURLName: dev.emassey0135.lumenna
            CFBundleURLSchemes:
              - lumenna
        # The App Group shared with the app's extensions, which holds the store and the glance
        # (Shared/AppGroup.swift).
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
        # Iroh connects straight to paired devices on the same network when it can.
        NSLocalNetworkUsageDescription: Lumenna finds your other devices on this network and syncs with them directly.
        # The DNS-SD services Lumenna announces and browses (crates/sync/src/discovery). iOS
        # blocks any service type not listed here.
        NSBonjourServices:
          - _lumenna._udp
          - _lumenna-pair._udp
        UILaunchScreen: {}
        # Syncing in the background: a refresh now and then (BackgroundSync).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.emassey0135.lumenna.sync
        # New Task on the app icon's quick actions (SceneDelegate).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.emassey0135.lumenna.new-task
            UIApplicationShortcutItemTitle: New Task
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna
        TARGETED_DEVICE_FAMILY: "1,2"
        LUMENNA_APP_GROUP: group.dev.emassey0135.lumenna
        CODE_SIGN_ENTITLEMENTS: Lumenna/Lumenna.entitlements
        # The script writes into the source tree and runs Cargo, neither of which the
        # script sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        # The core is built for Apple silicon only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          RUST_PROFILE: debug
        Release:
          RUST_PROFILE: release
        AppStore:
          RUST_PROFILE: release

  LumennaWidgetsiOS:
    templates: [LumennaWidgets]
    platform: iOS
    sources:
      # Today's Mark Done: Complete a Task, on the store in the group.
      - path: Shared/Intents
        group: Shared
        includes:
          - Assistant.swift
          - AssistantEntities.swift
          - CompleteTaskIntent.swift
      - path: Lumenna/Core
        group: Lumenna
        includes:
          - Colours.swift
    dependencies:
      # Linked, not embedded: the app embeds it, and the extension finds it there.
      - target: LumennaAppiOS
        embed: false
    info:
      path: Widgets/iOS/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        LUMENNA_APP_GROUP: group.dev.emassey0135.lumenna
        CODE_SIGN_ENTITLEMENTS: Lumenna/Lumenna.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # The Apple Watch app: SwiftUI over a core built without Iroh, since watchOS allows no
  # sockets outside an audio session. It keeps a whole store and syncs it with the iPhone
  # over WatchConnectivity (Watch/PhoneSync.swift, Lumenna/App/WatchLink.swift).
  LumennaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      # What the phone and the watch word alike: times, text offsets and errors.
      - path: Shared/Clock.swift
        group: Shared
      - path: Shared/Words.swift
        group: Shared
      # The Crux app, which every screen draws, and the questions it asks.
      - path: Shared/AppModel.swift
        group: Shared
      - path: Shared/AppQuestions.swift
        group: Shared
      # Reminders as the system's notifications, scheduled as the phone schedules them.
      - path: Shared/Reminders.swift
        group: Shared
      # What the app says, shown as well as spoken.
      - path: Shared/Said.swift
        group: Shared
      # A colour drawn beside a name.
      - path: Shared/Swatch.swift
        group: Shared
      # The colours text is drawn in, the forms' and the complications'.
      - path: Shared/Palette.swift
        group: Shared
      # A complication tapped or a control pressed opens the app on the core's launch.
      - path: Shared/LaunchURL.swift
        group: Shared
      - path: Shared/Launches.swift
        group: Shared
      # Changes handed on to the phone when it is out of reach.
      - path: Shared/LinkParcel.swift
        group: Shared
      # Every assistant operation as an App Intent, for Siri and Shortcuts.
      - path: Shared/Intents
        group: Shared
      # The watch's own App Group, which holds its store and the complications' glance.
      - path: Shared/AppGroup.swift
        group: Shared
      - path: Shared/GlanceFile.swift
        group: Shared
      # The task, block and settings forms the iPhone and the Mac use, with the watch's
      # differences beside theirs (FormParts.swift).
      - path: Shared/Forms
        group: Shared
      # The lists and the day as the app has them, and how a row's actions are split, the
      # phone's and the Mac's too.
      # Through their folder, so each file sits in one group: added by path into Shared, each
      # was a child of two groups, which Xcode 27.2 refuses to read.
      - path: Shared/Screens
        group: Shared
        includes:
          - TaskListModel.swift
          - DayModel.swift
          - AppRowActions.swift
    dependencies:
      - target: LumennaAppWatch
      # The complications.
      - target: LumennaWidgetsWatch
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.emassey0135.lumenna
        # A widget opens the app on one of the core's launches: lumenna://launch/<id>
        # (Shared/LaunchURL.swift).
        CFBundleURLTypes:
          - CFBundleURLName: dev.emassey0135.lumenna
            CFBundleURLSchemes:
              - lumenna
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.watchkitapp
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The watch's own: an App Group is one device's, and the watch's store is its own.
        LUMENNA_APP_GROUP: group.dev.emassey0135.lumenna.watch
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Watch/App/include
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

  # The watch's complications and Smart Stack: Now alone, reading the watch's own group.
  LumennaWidgetsWatch:
    templates: [LumennaWidgets]
    platform: watchOS
    dependencies:
      - target: LumennaAppWatch
        embed: false
    info:
      path: Widgets/Watch/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.watchkitapp.widgets
        LUMENNA_APP_GROUP: group.dev.emassey0135.lumenna.watch
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Watch/App/include
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

  LumennaWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: LumennaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.watchkitapp.uitests
        TEST_TARGET_NAME: LumennaWatch
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

  LumennaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumennaUITests
    dependencies:
      - target: Lumenna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.uitests
        TEST_TARGET_NAME: Lumenna
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # Tests hosted in the iPhone app, of what it offers without driving it through gestures:
  # each list's swipe actions, which VoiceOver offers as its actions, run directly.
  LumennaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumennaTests
      # The widgets' model, which the extension has apart from the app.
      - path: Widgets
        includes:
          - GlanceWidgets.swift
          - ControlModel.swift
    dependencies:
      - target: Lumenna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's module refers to the core's C module, which tests importing it need too.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # The Mac app: AppKit, with SwiftUI for leaf forms. Two editions from these sources: the
  # direct download (Debug, Release), not sandboxed, so it shares `lum`'s profile in
  # ~/Library/Application Support/lumenna — the app and the command line on one Mac are one
  # device; and the App Store edition (AppStore, scheme LumennaMacAppStore), sandboxed, its
  # store in its App Group container, without `lum`.
  LumennaMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
    postBuildScripts:
      # `lum`, which build-core.sh made as the core's framework built, beside the app in
      # Contents/MacOS, signed before the app is so the app's seal covers it. A script rather
      # than Copy Files, which would look for it before the framework's phase, shared with the
      # phone and the watch, could name it as made; and signed with the hardened runtime, as
      # notarization wants of every program in the bundle.
      - name: Put lum in the app
        basedOnDependencyAnalysis: false
        script: |
          # The App Store edition carries none: a sandboxed `lum` could not open what is named
          # to it, nor be put on the path by the app.
          [ "$LUMENNA_EDITION" = appstore ] && exit 0
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/lum"
          cp -f "$SRCROOT/Generated/Mac/lum" "$dest"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime "$dest"
          fi
      - name: Check the core is linked in, not loaded
        basedOnDependencyAnalysis: false
        script: |
          # A copied app would look for the library where Cargo left it. Fail here instead.
          for binary in "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/MacOS/$EXECUTABLE_NAME.debug.dylib"; do
            [ -f "$binary" ] || continue
            if otool -L "$binary" | grep -q liblumenna_; then
              echo "error: $binary loads Cargo's dynamic library; the core must be linked statically"
              exit 1
            fi
          done
    dependencies:
      - target: LumennaAppMac
      # The widgets, both editions'.
      - target: LumennaWidgetsMac
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      # RegisterEventHotKey: global shortcuts that need no accessibility permission.
      - sdk: Carbon.framework
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        # A widget opens the app on one of the core's launches: lumenna://launch/<id>
        # (Shared/LaunchURL.swift).
        CFBundleURLTypes:
          - CFBundleURLName: dev.emassey0135.lumenna
            CFBundleURLSchemes:
              - lumenna
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
        NSLocalNetworkUsageDescription: Lumenna finds your other devices on this network and syncs with them directly.
        NSBonjourServices:
          - _lumenna._udp
          - _lumenna-pair._udp
    settings:
      base:
        PRODUCT_NAME: Lumenna
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        # One group for both editions, which hold the glance in it (and the App Store edition its
        # store). On the Mac a group is named after the team; kept short, since the App Store
        # edition's command socket is in it (<group>/lumenna/lumenna.sock), and a Unix socket's
        # path holds at most 103 bytes.
        LUMENNA_APP_GROUP: $(DEVELOPMENT_TEAM).lumenna
        CODE_SIGN_ENTITLEMENTS: Mac/Lumenna.entitlements
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Mac/AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE

  # The Mac's widgets, for both editions. A Mac extension is always sandboxed, so in the direct
  # download it reaches only the group, which holds the glance alone; the App Store edition's
  # store is there too. Its entitlements are the same in both, set for each configuration.
  LumennaWidgetsMac:
    templates: [LumennaWidgets]
    platform: macOS
    sources:
      - path: Shared/Intents
        group: Shared
        includes:
          - Assistant.swift
          - AssistantEntities.swift
          - CompleteTaskIntent.swift
      # How the direct download's Mark Done is handed to the app, whose store it cannot reach.
      - path: Shared/WidgetRequests.swift
        group: Shared
      - path: Mac/Core
        group: Mac
        includes:
          - Colours.swift
    dependencies:
      - target: LumennaAppMac
        embed: false
    info:
      path: Widgets/Mac/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        LumennaAppGroup: $(LUMENNA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.widgets
        ENABLE_HARDENED_RUNTIME: YES
        LUMENNA_APP_GROUP: $(DEVELOPMENT_TEAM).lumenna
        CODE_SIGN_ENTITLEMENTS: Widgets/Mac/Widgets.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/App/include
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Widgets/Mac/Widgets.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LUMENNA_WIDGETS APP_STORE

  LumennaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacUITests
    dependencies:
      - target: LumennaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emassey0135.lumenna.mac.uitests
        TEST_TARGET_NAME: LumennaMac
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumenna:
    build:
      targets:
        Lumenna: all
        LumennaUITests: [test]
        LumennaTests: [test]
    test:
      targets:
        - LumennaTests
        - LumennaUITests
  LumennaWatch:
    build:
      targets:
        LumennaWatch: all
        LumennaWatchUITests: [test]
    test:
      targets:
        - LumennaWatchUITests
  LumennaMac:
    build:
      targets:
        LumennaMac: all
        LumennaMacUITests: [test]
    test:
      targets:
        - LumennaMacUITests
  # The Mac App Store edition: the same target, built in its own configuration.
  LumennaMacAppStore:
    build:
      targets:
        LumennaMac: all
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
