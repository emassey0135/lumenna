# The Xcode project, generated by XcodeGen: `cd apps/apple && xcodegen`. The .xcodeproj is output,
# not source — edit this file and regenerate.
#
# The Rust core is built by build-core.sh before every build, for whichever platform Xcode
# is building, and linked as a static library. Its Swift bindings, LumennaCore.swift, are
# regenerated by the same script and compiled into the app.
name: Lumenna
options:
  bundleIdPrefix: io.github.emassey0135
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signing for a device needs the team; the simulator needs none.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3QAJ2S64Z7

targets:
  Lumenna:
    type: application
    platform: iOS
    sources:
      - path: Lumenna
      - path: Generated/bindings/LumennaCore.swift
        optional: true
        group: Generated
    preBuildScripts:
      - name: Build the Rust core
        script: '"$SRCROOT/build-core.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/bindings/LumennaCore.swift
    postBuildScripts:
      - name: Check the core is linked in, not loaded
        basedOnDependencyAnalysis: false
        script: |
          # A reference to the Rust library as a dylib means the app looks for it on the
          # Mac's disk at launch: fine in the simulator, a crash on a phone. Fail here instead.
          for binary in "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/$EXECUTABLE_NAME.debug.dylib"; do
            [ -f "$binary" ] || continue
            if otool -L "$binary" | grep -q liblumenna_ffi; then
              echo "error: $binary loads liblumenna_ffi dynamically; it must be linked statically"
              exit 1
            fi
          done
    dependencies:
      - sdk: Security.framework
    info:
      path: Lumenna/Info.plist
      properties:
        CFBundleDisplayName: Lumenna
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.emassey0135.lumenna
        TARGETED_DEVICE_FAMILY: "1,2"
        # The script writes into the source tree and runs Cargo, neither of which the
        # script sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
        # The static library, by its full path. Cargo also builds a dynamic one beside it
        # for uniffi-bindgen, and `-llumenna_ffi` would make the linker prefer that: the app
        # then loads it from the Mac's disk at launch, which works in the simulator — it
        # runs on the Mac — and crashes on a phone.
        "RUST_LIB_DIR[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "RUST_LIB_DIR[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        OTHER_LDFLAGS: $(RUST_LIB_DIR)/liblumenna_ffi.a
        # The core is built for Apple silicon only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          RUST_PROFILE: debug
        Release:
          RUST_PROFILE: release

  LumennaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumennaUITests
    dependencies:
      - target: Lumenna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.emassey0135.lumenna.uitests
        TEST_TARGET_NAME: Lumenna
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

schemes:
  Lumenna:
    build:
      targets:
        Lumenna: all
        LumennaUITests: [test]
    test:
      targets:
        - LumennaUITests
