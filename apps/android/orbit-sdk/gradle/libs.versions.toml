# What the SDK's build uses, under the same aliases as an app's catalog that includes it as a
# module, so its one build file works in both.
[versions]
agp = "9.4.1"

[libraries]
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
