name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, library, sample and API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner has the Android SDK already, but not always the platform this builds against.
      - name: Android platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "platforms;android-37.0" > /dev/null
      - name: JVM tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: The library and the sample app
        run: ./gradlew --no-daemon assembleRelease :sample:assembleDebug
      - name: API reference
        run: ./gradlew --no-daemon dokkaGenerate
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-sdk
          path: |
            build/outputs/aar/*.aar
            sample/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build/dokka/html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests
