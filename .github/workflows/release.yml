# Release builds of every app, unsigned, kept as artifacts: what only a release build shows
# (R8's shrinking, fat LTO, a statically linked core, the ARM64 Windows build) is found as it
# is made rather than at publishing, and these are what packaging and publishing build on.
# Signing, packages and the stores come later (ROADMAP.md, Before others use it).
#
# Apart from CI (ci.yml), which tests every push: whole-program builds take long, so these run
# on master, on a version tag, and when asked.
name: Release builds

on:
  push:
    branches: [master]
    tags: ["v*"]
    # A commit to the notes for people and for Claude alone builds nothing: it would only rebuild
    # every app and cancel a run that matters. A tag is built whatever it touched. Markdown that
    # ships, such as BTSpeak's help topics, is not among these.
    paths-ignore: ["**/CLAUDE.md", "**/README.md", "ROADMAP.md"]
  # Asked for by hand, a run builds the platforms named (space-separated job names), so a branch
  # checks the one it changed without building every app.
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to build: all, or any of debian windows gtk apple android flatpak web"
        type: string
        default: all

# A newer push to master replaces the run still going for the one before it, as CI's do.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  debian:
    name: lum, ${{ matrix.btspeak && 'and the BTSpeak app, ' || '' }}Linux ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' debian ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm, btspeak: true }
    runs-on: ${{ matrix.os }}
    # Debian 12, for its glibc (2.36) and Python (3.11): the oldest the BTSpeak and BT Braille
    # run, so the same lum starts on them and on any newer Linux, and the BTSpeak app's core is
    # an extension for the Python they have.
    container: debian:bookworm
    steps:
      - name: A compiler, for ring's and SQLite's C, and xz; for the BTSpeak app, Python with its headers and pip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git xz-utils \
            ${{ matrix.btspeak && 'python3 python3-dev python3-pip python3-venv' || '' }}
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p lumenna-cli
      - name: In a tarball, xz, which keeps it executable as an artifact alone does not
        run: |
          version=$(cargo pkgid -p lumenna-cli | sed 's/.*@//')
          mkdir -p dist staging
          cp target/release/lum staging/
          cp LICENSE staging/
          XZ_OPT=-9 tar -cJf "dist/lum-$version-linux-${{ matrix.arch }}.tar.xz" -C staging lum LICENSE
          mkdir unpacked && tar -xJf dist/*.tar.xz -C unpacked && unpacked/lum --version
      - uses: actions/upload-artifact@v4
        with:
          name: lum-linux-${{ matrix.arch }}
          path: dist/*.tar.xz
          retention-days: 30
      - name: BoltFFI, which the BTSpeak app's build-core.sh builds its core with
        if: matrix.btspeak
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: The BTSpeak app's core
        if: matrix.btspeak
        run: apps/btspeak/build-core.sh
      - name: The BTSpeak app with its core
        if: matrix.btspeak
        run: |
          mkdir -p btspeak
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files apps/btspeak | grep -v '^apps/btspeak/tests/' | tar -cf btspeak/lumenna-btspeak.tar -T -
          tar -rf btspeak/lumenna-btspeak.tar apps/btspeak/native
          gzip btspeak/lumenna-btspeak.tar
      - name: The BTSpeak app, unpacked as a device gets it, loads its core
        if: matrix.btspeak
        run: |
          mkdir unpacked-btspeak && tar -xzf btspeak/lumenna-btspeak.tar.gz -C unpacked-btspeak
          cd unpacked-btspeak/apps/btspeak && python3 -S -c 'import core; core.native()'
      - uses: actions/upload-artifact@v4
        if: matrix.btspeak
        with:
          name: btspeak-arm64
          path: btspeak/lumenna-btspeak.tar.gz
          retention-days: 30

  # lum for macOS, universal, is the Mac app's own, made in its job (apple).

  windows:
    name: Windows installer and MSIX, ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' windows ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-2025 }
          - { arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clang for ring (arm64)
        # ring's C needs clang on ARM64 Windows; Visual Studio ships one.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $clang = Get-ChildItem -Recurse -Filter clang.exe "$vs\VC\Tools\Llvm" | Where-Object { $_.FullName -match 'ARM64' } | Select-Object -First 1
          if (-not $clang) { $clang = Get-ChildItem -Recurse -Filter clang.exe "$vs\VC\Tools\Llvm" | Select-Object -First 1 }
          Add-Content $env:GITHUB_PATH $clang.DirectoryName
      - name: Build
        run: cargo build --release --locked -p lumenna-windows -p lumenna-cli
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem -Recurse -Filter ISCC.exe "${env:ProgramFiles(x86)}\Inno Setup*", "$env:ProgramFiles\Inno Setup*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup's compiler is not where it installs" }
          "ISCC=$($iscc.FullName)" | Add-Content $env:GITHUB_ENV
      - name: The installer, the app and lum together
        shell: pwsh
        run: |
          $version = (cargo pkgid -p lumenna-windows).Split('@')[-1]
          & $env:ISCC /Qp "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSource=$env:GITHUB_WORKSPACE\target\release" "/DOutput=$env:GITHUB_WORKSPACE\dist" apps\windows\installer\lumenna.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
          Get-ChildItem dist
      - name: It installs, puts lum on PATH, and uninstalls, keeping the store
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Lumenna"
          if (-not (Test-Path "$app\lumenna.exe")) { throw "lumenna.exe is not in $app" }
          & "$app\lum.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "lum did not run" }
          if ((Get-ItemProperty HKCU:\Environment).Path -notlike "*$app*") { throw "lum is not on the PATH" }
          # A store in the profile's place, which a silent uninstall must leave alone.
          $store = "$env:LOCALAPPDATA\lumenna\data"
          New-Item -ItemType Directory -Force $store | Out-Null
          Set-Content "$store\kept" "a silent uninstall keeps this"
          # The uninstaller hands itself to a copy and returns at once, so its work is waited for.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path "$app\lumenna.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\lumenna.exe") { throw "the uninstaller left lumenna.exe" }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*$app*") { throw "the uninstaller left lum on the PATH" }
          if (-not (Test-Path "$store\kept")) { throw "a silent uninstall deleted the store" }
      - name: The MSIX for the Store, and a signed copy installed and checked
        # Unsigned, as the Store takes it. Its identity is a stand-in until Partner Center gives
        # the real one, set then as the repository's variables.
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'dev.emassey0135.Lumenna' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Elijah Massey' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Elijah Massey' }}
        run: |
          $version = (cargo pkgid -p lumenna-windows).Split('@')[-1]
          $msix = powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\msix\pack.ps1 `
            -Arch ${{ matrix.arch }} -Version $version -Source "$env:GITHUB_WORKSPACE\target\release" -Output "$env:GITHUB_WORKSPACE\dist" `
            -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "the MSIX did not pack" }
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\msix\test.ps1 `
            -Package $msix -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER
          if ($LASTEXITCODE -ne 0) { throw "the MSIX did not install and run" }
      - name: lum alone, for the command line without the app
        # A zip as Scoop and winget's portable packages take it, and as servers want it.
        shell: pwsh
        run: |
          $version = (cargo pkgid -p lumenna-cli).Split('@')[-1]
          $staging = "$env:RUNNER_TEMP\lum"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item target\release\lum.exe $staging
          Copy-Item LICENSE "$staging\LICENSE.txt"
          $zip = "dist\lum-$version-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force
          # What is unpacked from it runs.
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\lum-unpacked" -Force
          & "$env:RUNNER_TEMP\lum-unpacked\lum.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the lum in the zip did not run" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*-setup.exe
            dist/*.msix
            dist/*.zip
          retention-days: 30

  gtk:
    name: GTK app as an AppImage, ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' gtk ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, appimage: x86_64 }
          - { arch: arm64, os: ubuntu-24.04-arm, appimage: aarch64 }
    # Ubuntu 24.04: libadwaita 1.5, the app's floor, and glibc 2.39, the AppImage's.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          # GTK and libadwaita to build against; then what the AppImage's GTK plugin gathers
          # (pixbuf loaders, schemas, SVG), and a display to start it on.
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgdk-pixbuf2.0-bin libglib2.0-bin librsvg2-common xvfb
      - name: Build
        run: cargo build --release --locked -p lumenna-gtk
      - name: The AppImage, GTK and libadwaita inside it
        env:
          # The tools are AppImages themselves, and a runner has no FUSE to mount them with.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
          ARCH: ${{ matrix.appimage }}
        run: |
          # What the entry and the metainfo say of Lumenna, the version too, is the workspace's.
          version=$(apps/gtk/data/metadata get version)
          apps/gtk/data/metadata fill apps/gtk/data/dev.emassey0135.Lumenna.desktop > "$RUNNER_TEMP/dev.emassey0135.Lumenna.desktop"
          apps/gtk/data/metadata fill apps/gtk/data/dev.emassey0135.Lumenna.metainfo.xml > "$RUNNER_TEMP/dev.emassey0135.Lumenna.metainfo.xml"
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools" dist
          curl -fsSL -o "$tools/linuxdeploy" "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage }}.AppImage"
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk" https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          # The new runtime, statically linked, so the AppImage needs no FUSE 2 where it runs.
          curl -fsSL -o "$tools/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage"
          chmod +x "$tools"/*
          export PATH="$tools:$PATH"
          linuxdeploy --appdir AppDir \
            --executable target/release/lumenna-gtk \
            --desktop-file "$RUNNER_TEMP/dev.emassey0135.Lumenna.desktop" \
            --icon-file apps/gtk/data/icons/hicolor/256x256/apps/dev.emassey0135.Lumenna.png \
            --icon-file apps/gtk/data/icons/hicolor/scalable/apps/dev.emassey0135.Lumenna.svg \
            --plugin gtk
          install -Dm644 "$RUNNER_TEMP/dev.emassey0135.Lumenna.metainfo.xml" AppDir/usr/share/metainfo/dev.emassey0135.Lumenna.metainfo.xml
          # zstd at its strongest with 1 MiB blocks: 42 MB where appimagetool's own (128 KiB blocks)
          # made 45, and it unpacks as fast at any level. xz made 38, but starts slower.
          appimagetool --no-appstream --comp zstd \
            --mksquashfs-opt -b --mksquashfs-opt 1048576 \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            AppDir "dist/Lumenna-$version-${{ matrix.appimage }}.AppImage"
          ls -l dist
      - name: The AppImage starts and keeps running
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export LUMENNA_PROFILE="$RUNNER_TEMP/profile"
          # In the background, as at sign-in: still running after the time out (124) is what passes.
          status=0
          xvfb-run -a timeout 20 dist/Lumenna-*.AppImage --background --no-shortcuts || status=$?
          if [ "$status" -ne 124 ]; then echo "::error::the AppImage stopped with status $status"; exit 1; fi
          test -f "$LUMENNA_PROFILE/lumenna.sqlite"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 30

  apple:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' apple ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The iPhone app embeds the Apple Watch app, so it builds the watch's core too.
          - name: iPhone and Apple Watch apps, for devices
            scheme: Lumenna
            destination: generic/platform=iOS
            targets: aarch64-apple-ios, aarch64-apple-watchos
            products: Release-iphoneos
            artifact: ios
          - name: Mac app and lum, Apple silicon and Intel
            scheme: LumennaMac
            destination: generic/platform=macOS
            targets: aarch64-apple-darwin, x86_64-apple-darwin
            products: Release
            artifact: macos
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: BoltFFI, which build-core.sh generates the app's Swift with
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: Newest Xcode, and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew install xcodegen
      - name: Build
        working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Lumenna.xcodeproj -scheme ${{ matrix.scheme }} -configuration Release \
            -destination '${{ matrix.destination }}' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/derived/Build/Products/${{ matrix.products }}/Lumenna.app"
          mkdir -p "$RUNNER_TEMP/dist"
          if [ "${{ matrix.artifact }}" = macos ]; then
            # The lum it carries, for both architectures, runs; and is lum alone too, in a tarball,
            # which keeps it executable as an artifact alone does not.
            lum="$app/Contents/MacOS/lum"
            archs=" $(lipo -archs "$lum") "
            for arch in arm64 x86_64; do
              case "$archs" in *" $arch "*) ;; *) echo "::error::lum has no $arch:$archs"; exit 1 ;; esac
            done
            "$lum" --version
            lum_version=$(cd "$GITHUB_WORKSPACE" && cargo pkgid -p lumenna-cli | sed 's/.*@//')
            mkdir "$RUNNER_TEMP/lum" "$RUNNER_TEMP/lum-dist"
            cp "$lum" "$GITHUB_WORKSPACE/LICENSE" "$RUNNER_TEMP/lum/"
            tar --options xz:compression-level=9 -cJf "$RUNNER_TEMP/lum-dist/lum-$lum_version-macos-universal.tar.xz" -C "$RUNNER_TEMP/lum" lum LICENSE
            mkdir "$RUNNER_TEMP/lum-unpacked"
            tar -xJf "$RUNNER_TEMP"/lum-dist/*.tar.xz -C "$RUNNER_TEMP/lum-unpacked"
            "$RUNNER_TEMP/lum-unpacked/lum" --version
            # The Mac's: a disk image holding the app beside a link to Applications, to drag it to.
            # LZMA (ULMO, macOS 10.15 and later, where the app needs 14) rather than zlib (UDZO):
            # the app and the lum beside it each carry the whole core, for both architectures.
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            mkdir "$RUNNER_TEMP/image"
            cp -R "$app" "$RUNNER_TEMP/image/"
            ln -s /Applications "$RUNNER_TEMP/image/Applications"
            hdiutil create -volname Lumenna -srcfolder "$RUNNER_TEMP/image" -fs HFS+ -format ULMO \
              -ov "$RUNNER_TEMP/dist/Lumenna-$version.dmg"
            hdiutil verify "$RUNNER_TEMP/dist/Lumenna-$version.dmg"
          else
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/dist/Lumenna-${{ matrix.artifact }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.artifact }}
          path: ${{ runner.temp }}/dist
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'macos'
        with:
          name: lum-macos-universal
          path: ${{ runner.temp }}/lum-dist
          retention-days: 30

  android:
    name: Android and Wear OS apps
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' android ') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: NDK, platform and BoltFFI
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "ndk;30.0.16248370" "platforms;android-37.0" > /dev/null
          cargo install boltffi_cli --version 0.31.1 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build
        # The App Bundles the stores take, and the APKs to install by hand. Unsigned: Play App
        # Signing and the upload key come with publishing.
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:bundleRelease :wear:bundleRelease :app:assembleRelease :wear:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/android/app/build/outputs/bundle/release
            apps/android/wear/build/outputs/bundle/release
            apps/android/app/build/outputs/apk/release
            apps/android/wear/build/outputs/apk/release
          retention-days: 30

  flatpak:
    name: Flatpak, ${{ matrix.arch }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' flatpak ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # Flatpak's own builder, with the GNOME 51 SDK the manifest builds on.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Its version, for the bundle's name
        id: version
        run: echo "version=$(sh apps/gtk/data/metadata get version)" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: apps/gtk/flatpak/dev.emassey0135.Lumenna.yml
          bundle: Lumenna-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - name: The bundle installs, and lum runs in its sandbox and keeps its store there
        run: |
          bundle="Lumenna-${{ steps.version.outputs.version }}-${{ matrix.arch }}.flatpak"
          # The container has no machine id, which Flatpak needs to start a message bus.
          [ -s /etc/machine-id ] || cat /proc/sys/kernel/random/uuid | tr -d - > /etc/machine-id
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          flatpak install --user -y --noninteractive --bundle "$bundle"
          flatpak run --command=lum dev.emassey0135.Lumenna --version
          flatpak run --command=lum dev.emassey0135.Lumenna task add "Made in the sandbox"
          test -f "$HOME/.var/app/dev.emassey0135.Lumenna/data/lumenna/lumenna.sqlite"
          flatpak run --command=lum dev.emassey0135.Lumenna task list | grep -q "Made in the sandbox"
          # Not uninstalled: the container goes with the job, and uninstalling wants a session bus.
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: Lumenna-*.flatpak
          retention-days: 30

  web:
    name: Web client
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(format(' {0} ', inputs.platforms), ' web ') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen, at the version in Cargo.lock
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127
      - name: BoltFFI
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: The built client, served, answers with its page and its core
        run: |
          npx vite preview --port 4173 --strictPort &
          for _ in $(seq 30); do curl -fs http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:4173/ | grep -q '<script'
          wasm=$(cd dist && find . -name '*.wasm' | head -1 | sed 's|^\./||')
          curl -fsI "http://localhost:4173/$wasm" | grep -qi 'application/wasm'
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
          retention-days: 30
