# Builds and tests everything, on every push and pull request: the Rust workspace on Linux,
# macOS and Windows, each on x86_64 and arm64; the GTK and Windows apps' UI tests; the
# BTSpeak client on the app in-process and the Emacs client against a real `lum rpc`; the web client in a browser; the Apple
# apps; and Android for both its ABIs. Several sessions work on this repository at once,
# and this is what catches one breaking another. A branch runs only what its changes can
# break (`changes`, below), so one app's branch does not wait behind another's macOS jobs;
# master runs everything.
#
# Two tiers. What blocks is what fails only for a reason: the Rust tests, every build, the
# clients, the GTK and Windows UI tests, and a smoke set of the iOS and Android UI tests.
# The full iOS and Android suites run too and report, but do not block: they drive
# simulators and emulators through gestures and timing, and a slow runner fails them
# where nothing is wrong. They, the Mac's full UI suite, WebKit and Rust on Intel macOS run
# on master alone, since most wait for one of the few macOS runners a branch would queue for.
name: CI

on:
  # A commit to the notes for people and for Claude alone tests nothing, and would cancel a run
  # that does. Markdown that ships, such as BTSpeak's help topics, is not among these.
  push:
    paths-ignore: ["**/CLAUDE.md", "**/README.md", "ROADMAP.md"]
  pull_request:
    paths-ignore: ["**/CLAUDE.md", "**/README.md", "ROADMAP.md"]

# A newer push replaces the run still going for the one before it, on master as on a pull
# request: with several sessions pushing, a run per commit piled up and failure mail with
# it. A commit followed soon by another is tested only as part of the newer one, and a
# stretch of pushes closer together than the slowest jobs (the Apple apps') finishes them
# only once it ends.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Lints are warnings in the workspace; here they fail the build, so none accumulate.
  RUSTFLAGS: -D warnings
  # Every test harness keeps its backups out of the profile it tests.
  LUMENNA_BACKUP_DIR: ${{ github.workspace }}/../backups

jobs:
  # What a push changed, so a branch runs only the jobs its changes can break: a change to the
  # core runs everything, one to an app its own jobs (and the Rust workspace's, for an app
  # written in Rust). Master, a pull request and a run asked for test everything, since that
  # is where branches meet. A job left out by this is skipped, not failed.
  #
  # `full` is master's alone (and a pull request's): the suites that only report (iOS, the
  # Mac's and Android's every test, WebKit) and Rust on Intel macOS, most of which wait for
  # one of the few macOS runners. A branch runs the builds and what blocks.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.groups.outputs.full }}
      rust: ${{ steps.groups.outputs.rust }}
      core: ${{ steps.groups.outputs.core }}
      rust_apps: ${{ steps.groups.outputs.rust_apps }}
      apple: ${{ steps.groups.outputs.apple }}
      android: ${{ steps.groups.outputs.android }}
      windows: ${{ steps.groups.outputs.windows }}
      gtk: ${{ steps.groups.outputs.gtk }}
      web: ${{ steps.groups.outputs.web }}
      cli: ${{ steps.groups.outputs.cli }}
      clients: ${{ steps.groups.outputs.clients }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: groups
        run: |
          groups="core rust_apps apple android windows gtk web cli clients"
          # Where the Rust workspace's tests run, Intel macOS on master alone.
          rust='{ "name": "Linux x86_64", "os": "ubuntu-24.04", "exclude": "" },
            { "name": "Linux arm64", "os": "ubuntu-24.04-arm", "exclude": "" },
            { "name": "macOS arm64", "os": "macos-15", "exclude": "--exclude lumenna-gtk" },
            { "name": "Windows x86_64", "os": "windows-2025", "exclude": "--exclude lumenna-gtk" },
            { "name": "Windows arm64", "os": "windows-11-arm", "exclude": "--exclude lumenna-gtk" }'
          intel='{ "name": "macOS x86_64", "os": "macos-15-intel", "exclude": "--exclude lumenna-gtk" }'
          if [ "$GITHUB_REF" = refs/heads/master ] || [ "$GITHUB_EVENT_NAME" != push ] || ! git rev-parse -q --verify origin/master >/dev/null; then
            for group in $groups full; do echo "$group=true" >> "$GITHUB_OUTPUT"; done
            echo "rust=[$(echo "$rust, $intel" | tr -d '\n')]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "rust=[$(echo "$rust" | tr -d '\n')]" >> "$GITHUB_OUTPUT"
          # Everything the branch changed since it left master, not only its last push: a run
          # cancelled by a newer push tested nothing of the commits before it.
          changed=$(git diff --name-only origin/master...HEAD)
          echo "$changed"
          has() { if echo "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            echo "core=$(has '^(crates/|Cargo\.(toml|lock)$|\.cargo/|\.github/workflows/ci\.yml$)')"
            echo "rust_apps=$(has '^apps/(windows|gtk|cli|web/core)/')"
            echo "apple=$(has '^apps/apple/')"
            echo "android=$(has '^apps/android/')"
            echo "windows=$(has '^apps/windows/')"
            echo "gtk=$(has '^apps/gtk/')"
            echo "web=$(has '^apps/web/')"
            echo "cli=$(has '^apps/cli/')"
            echo "clients=$(has '^apps/(btspeak|emacs)/')"
          } | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.rust_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux, macOS and Windows, each on x86_64 and arm64; Intel macOS on master alone
        # (`changes`).
        include: ${{ fromJSON(needs.changes.outputs.rust) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Clang for ring (Windows arm64)
        # ring's C needs clang on ARM64 Windows; Visual Studio ships one.
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $clang = Get-ChildItem -Recurse -Filter clang.exe "$vs\VC\Tools\Llvm" | Where-Object { $_.FullName -match 'ARM64' } | Select-Object -First 1
          if (-not $clang) { $clang = Get-ChildItem -Recurse -Filter clang.exe "$vs\VC\Tools\Llvm" | Select-Object -First 1 }
          Add-Content $env:GITHUB_PATH $clang.DirectoryName
      - name: Clippy
        run: cargo clippy --workspace ${{ matrix.exclude }} --all-targets
      - name: Tests
        run: cargo test --workspace ${{ matrix.exclude }}

  gtk-ui:
    name: GTK UI tests
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.gtk == 'true'
    runs-on: ubuntu-24.04
    # Arch, for a current GTK. What the tests check is what Orca is told, and GTK only tells
    # AT-SPI a tree item's level from 4.16 and its position among its siblings from 4.22;
    # Ubuntu 24.04's 4.14 gives neither, so its lists read flat.
    container: archlinux:latest
    steps:
      - name: GTK, a headless GNOME session, AT-SPI and Rust
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 mutter dbus at-spi2-core python-gobject gsettings-desktop-schemas ttf-dejavu libadwaita
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: UI tests
        run: apps/gtk/tests/ui/run

  windows-ui:
    name: Windows UI tests
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.cli == 'true'
    # The real app, driven through its message queue and read back through UI Automation:
    # what NVDA and Narrator are given. It needs the runner's interactive desktop.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build lum, which two of the tests reach the running app through
        run: cargo build -p lumenna-cli
      - name: UI tests
        run: cargo test -p lumenna-windows --test ui -- --ignored

  clients:
    name: BTSpeak and Emacs clients
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.clients == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Build lum
        run: cargo build -p lumenna-cli
      - name: BoltFFI
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: The BTSpeak app's core, as a Python extension
        working-directory: apps/btspeak
        run: ./build-core.sh --debug
      - name: BTSpeak app
        working-directory: apps/btspeak
        run: PATH="$GITHUB_WORKSPACE/target/debug:$PATH" python3 -m unittest discover -s tests
      - name: Emacs client, byte-compiled
        # As package.el installs it, with any warning an error; the tests then run the compiled
        # code. The Emacsvox layer needs Emacsvox itself, which only a person's Emacs has.
        run: emacs --batch -Q -L apps/emacs --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile $(ls apps/emacs/*.el | grep -v emacsvox)
      - name: Emacs client
        run: emacs --batch -Q -L apps/emacs -l apps/emacs/test/lumenna-test.el -f ert-run-tests-batch-and-exit

  web:
    name: Web client
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen, at the version in Cargo.lock
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.127
      # The core's TypeScript bindings and its package (apps/web/scripts/build-core.mjs), at the
      # version the crates use.
      - name: BoltFFI
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      # The release core just built, for WebKit's run on a Mac (web-webkit), which needs no Rust:
      # taken before the debug core replaces it for Chromium, since the debug build's deeper
      # stack overflowed WebKit's worker ("Maximum call stack size exceeded") at every open.
      - uses: actions/upload-artifact@v4
        with:
          name: web-core
          path: apps/web/src/core
          retention-days: 1
      - run: npx playwright install --with-deps chromium webkit firefox
      # The installed app, against the build just made: opening with no network, the manifest.
      - name: The installed app
        run: npx playwright test --config playwright.pwa.config.ts
      - name: Playwright and axe
        run: npm run core:dev && npm test
      - name: Playwright and axe in Firefox
        run: npm run test:firefox
      # A failed test's trace (playwright.config.ts keeps it): what the page and the worker did,
      # for a failure that only a runner shows.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results
          retention-days: 7

  # Safari's engine on a Mac: Linux's WebKit (Playwright's MiniBrowser) aborted at every launch
  # with a persistent profile ("automation is not allowed in the context"), and WebKit needs one,
  # since a private window refuses the browser storage the store is in. One test at a time, as
  # its persistent contexts share one origin's storage; a test that fails once and then passes is
  # reported flaky rather than failing the run, as WebKit's timing was before as much as now.
  web-webkit:
    name: Web client in WebKit
    needs: [changes, web]
    if: needs.changes.outputs.full == 'true'
    runs-on: xcode-27
    # Its 59 tests take three minutes on a Mac; when every one failed and retried, the job ran
    # 80 minutes with the default six-hour limit still ahead of it.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-core
          path: apps/web/src/core
      - run: npx playwright install webkit
      - name: Playwright and axe in WebKit
        # Each failure said as it happens and the run stopped after a few: CI's own reporter
        # is a character per test, its reasons only in a file uploaded at the end.
        run: npm run test:webkit -- --retries=1 --reporter=line --max-failures=4
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: web-webkit-test-results
          path: apps/web/test-results
          retention-days: 7

  mac:
    name: Mac app, Apple silicon and Intel
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: BoltFFI, which build-core.sh generates the app's Swift with
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: Newest Xcode, and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew install xcodegen
      - name: Build
        working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Lumenna.xcodeproj -scheme LumennaMac -configuration Release \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build

  mac-ui:
    name: Mac app, every UI test
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # Reports without blocking, as the other full UI suites do. Locally they run with
    # VoiceOver on, which is why they enter text by pasting.
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: BoltFFI, which build-core.sh generates the app's Swift with
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: Newest Xcode, and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew install xcodegen
      - name: UI tests
        working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Lumenna.xcodeproj -scheme LumennaMac -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/mac.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 test
      - name: Test results, when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: ${{ runner.temp }}/mac.xcresult
          retention-days: 14

  watch:
    name: Apple Watch app and its tests
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-watchos-sim
      - uses: Swatinem/rust-cache@v2
      - name: BoltFFI, which build-core.sh generates the app's Swift with
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: Newest Xcode, and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew install xcodegen
      - name: A watch simulator
        # The newest Apple Watch the runtime has, downloading watchOS if the runner lacks it.
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then xcodebuild -downloadPlatform watchOS; fi
          device=$(xcrun simctl list devices available | grep -E '^\s+Apple Watch Series [0-9]+ \(46mm\) \(' | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$device" ]; then
            runtime=$(xcrun simctl list runtimes | grep watchOS | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.watchOS-[0-9-]+')
            type=$(xcrun simctl list devicetypes | grep -E 'Apple Watch Series [0-9]+ \(46mm\)' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
            device=$(xcrun simctl create "CI Watch" "$type" "$runtime")
          fi
          echo "WATCH=$device" >> "$GITHUB_ENV"
          # Some runners list a watchOS runtime whose files are gone ("cannot determine the
          # runtime bundle", "simulator runtime is not available"). Xcode will not download what
          # it believes it has, so the listed runtime is deleted first, then downloaded afresh,
          # and the watch made again on it.
          if ! xcrun simctl boot "$device" 2>boot.log && ! grep -q "current state: Booted" boot.log; then
            cat boot.log
            xcrun simctl runtime list || true
            for image in $(xcrun simctl runtime list -j | jq -r 'to_entries[] | select((.value.platformIdentifier // "") | test("watch")) | .key'); do
              xcrun simctl runtime delete "$image" || true
            done
            xcodebuild -downloadPlatform watchOS
            runtime=$(xcrun simctl list runtimes available | grep watchOS | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.watchOS-[0-9-]+')
            type=$(xcrun simctl list devicetypes | grep -E 'Apple Watch Series [0-9]+ \(46mm\)' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
            device=$(xcrun simctl create "CI Watch" "$type" "$runtime")
            echo "WATCH=$device" >> "$GITHUB_ENV"
            xcrun simctl boot "$device"
          fi
          xcrun simctl bootstatus "$device" -b
      - name: Build
        working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Lumenna.xcodeproj -scheme LumennaWatch -destination "id=$WATCH" \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: UI tests
        # Reporting, as the other full UI suites do, until they have shown they hold on CI.
        continue-on-error: true
        working-directory: apps/apple
        run: |
          # Each test once more if it fails: whichever test came first timed out launching the
          # app through Xcode on the just-booted watch, even after opening it with simctl.
          xcodebuild -project Lumenna.xcodeproj -scheme LumennaWatch -destination "id=$WATCH" \
            -retry-tests-on-failure -test-iterations 2 \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            test-without-building

  ios-build:
    name: iOS app and its tests, built once
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.apple == 'true'
    # Xcode 27 and the iOS 27 simulator, which people run. iOS 26's audit judges text faded
    # under the navigation bar's scroll-edge blur as failing contrast (and reports it with
    # no element); iOS 27's judges only what is shown.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The watch's too: the iPhone app embeds the Apple Watch app, core and all.
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-watchos-sim
      - uses: Swatinem/rust-cache@v2
      - name: BoltFFI, which build-core.sh generates the app's Swift with
        run: cargo install boltffi_cli --version 0.31.1 --locked
      - name: Newest Xcode, and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
      - name: Build for testing
        # The core and the app are built once here; each device below only runs the tests.
        working-directory: apps/apple
        run: |
          xcodegen
          xcodebuild -project Lumenna.xcodeproj -scheme Lumenna \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
          tar -C "$RUNNER_TEMP/derived/Build" -cf "$RUNNER_TEMP/products.tar" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/products.tar
          retention-days: 1

  ios:
    name: iOS, every test (${{ matrix.name }})
    needs: [changes, ios-build]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pro-sized, as the tests are run locally: the newest this Xcode has.
          - { name: iPhone, find: '^\s+iPhone [0-9]+ Pro \(' }
          # Large text on a small phone is where layouts break first: the newest "e", the
          # smallest phone Xcode lists. Xcode 27.2's newest iOS refused an SE ("Incompatible device").
          - { name: iPhone e, find: '^\s+iPhone [0-9]+e \(' }
          # The sidebar, the split views and the menu bar.
          - { name: iPad, find: '^\s+iPad Pro 11-inch' }
    runs-on: xcode-27
    # Reports; the smoke set below is what blocks.
    continue-on-error: true
    env:
      # An audit finding is attached as a screenshot of its element, so a failure on the
      # runner's iOS can be seen in the uploaded results, not only read about.
      TEST_RUNNER_AUDIT_ATTACH: "1"
    steps:
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}
      - name: Simulator
        run: |
          device=$(xcrun simctl list devices available | grep -E '${{ matrix.find }}' | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Testing on $(xcrun simctl list devices | grep "$device")"
          # Booted and settled first: a test runner started on a cold simulator timed out
          # waiting for accessibility to load, and ran nothing.
          xcrun simctl bootstatus "$device" -b
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: UI tests
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/products.tar"
          xcodebuild test-without-building \
            -xctestrun "$(ls "$RUNNER_TEMP"/Products/*.xctestrun | head -1)" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/results.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300
      - name: Test results, when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ matrix.name }}
          path: ${{ runner.temp }}/results.xcresult
          retention-days: 14

  ios-smoke:
    name: iOS smoke tests (iPhone)
    needs: ios-build
    runs-on: xcode-27
    env:
      TEST_RUNNER_AUDIT_ATTACH: "1"
    steps:
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}
      - name: Simulator
        run: |
          device=$(xcrun simctl list devices available | grep -E '^\s+iPhone [0-9]+ Pro \(' | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcrun simctl bootstatus "$device" -b
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Smoke tests
        # Adding, completing and undoing; the day; the audits of the main screens; a
        # keyboard command; and every list's swipe actions, run without a swipe
        # (LumennaTests). A few minutes, and each one has only failed for a reason.
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/products.tar"
          t=LumennaUITests/LumennaUITests
          xcodebuild test-without-building \
            -xctestrun "$(ls "$RUNNER_TEMP"/Products/*.xctestrun | head -1)" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:$t/testAddingATaskReadsItBackAndListsIt \
            -only-testing:$t/testCompletingRemovesTheTaskAndUndoBringsItBack \
            -only-testing:$t/testTheTaskListPassesAnAccessibilityAudit \
            -only-testing:$t/testTheDaySaysWhatItHoldsAndShowsFreeTime \
            -only-testing:$t/testSettingsAndDevicesPassAnAudit \
            -only-testing:LumennaUITests/KeyboardUITests/testCommandNOpensQuickAddFromAnotherTab \
            -only-testing:LumennaTests \
            -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/smoke.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300
      - name: Test results, when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-results
          path: ${{ runner.temp }}/smoke.xcresult
          retention-days: 14

  android-build:
    name: Android and Wear OS apps and their tests
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 32-bit ARM too: many Wear OS watches run a 32-bit Android.
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner has the Android SDK already; android-actions/setup-android fails asking for
      # the long-gone "tools" package.
      - name: NDK, platform and BoltFFI
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # The platform's licence is asked for even when the others are accepted.
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "ndk;30.0.16248370" "platforms;android-37.0" > /dev/null
          # The core and its Kotlin (crates/ffi), at the version the crates use.
          cargo install boltffi_cli --version 0.31.1 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/android
        # The core optimized: a debug one is about 160 MB an ABI, and the emulators took that
        # APK badly.
        env:
          LUMENNA_CORE_PROFILE: release
        # The release builds too, shrunk by R8, which only they run: a rule it refuses or a
        # class it cannot find would otherwise be found at release. The core is the same build.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebug :wear:assembleDebugAndroidTest :app:assembleRelease :wear:assembleRelease
      - name: Ready for 16 KB pages
        # Every native library must load at 16 KB boundaries, and sit 16 KB aligned in the
        # APK, or a 16 KB-page device refuses it. An x86_64 emulator emulates 16 KB pages,
        # and did not boot in ten minutes, so this is checked here instead.
        working-directory: apps/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)zipalign" -c -P 16 4 "$apk"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          dir=$(mktemp -d) && unzip -q "$apk" 'lib/*' -d "$dir"
          for lib in "$dir"/lib/*/*.so; do
            align=$("$readelf" -lW "$lib" | awk '/LOAD/ {print $NF}' | sort -u)
            echo "$lib: $align"
            [ "$align" = 0x4000 ] || { echo "::error::$lib is not 16 KB aligned"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          # Both apps', under apps/android, as each module builds them.
          path: |
            apps/android/app/build/outputs/apk
            apps/android/wear/build/outputs/apk
          retention-days: 1

  android:
    name: Android (${{ matrix.name }})
    needs: [changes, android-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The action's default device did not boot Android 37 in fifteen minutes.
          - { name: "phone, every test", profile: medium_phone, keyboard: false }
          # A desktop-sized screen with a keyboard: every screen in its wide layout, at its
          # real density, so the touch targets are checked as they are. The system images
          # stopped having a desktop of their own at API 34; this is the large screen alone.
          - { name: "desktop screen and keyboard, every test", profile: desktop_medium, keyboard: true }
          # The Wear OS app, on a round watch.
          - { name: "Wear OS watch, every test", profile: wearos_large_round, keyboard: false, app: wear, target: android-wear-signed }
          # The smoke set, which blocks: adding and completing, folding, focus after a
          # change, a keyboard command, no key erasing for good and erasing asking first, and
          # the large-text screens, each under Google's accessibility checks.
          - name: "phone, smoke tests"
            profile: medium_phone
            keyboard: false
            blocking: true
            tests: "dev.emassey0135.lumenna.LumennaTest#addingATaskReadsItBackAndListsIt,dev.emassey0135.lumenna.LumennaTest#completingATaskPutsFocusOnTheOneNowInItsPlaceThenSaysWhatHappened,dev.emassey0135.lumenna.LumennaTest#aTaskWithSubtasksCollapsesAndExpandsAndSaysWhichItIs,dev.emassey0135.lumenna.KeyboardTest#ctrlNOpensQuickAddFromAnotherTab,dev.emassey0135.lumenna.KeyboardTest#deleteOnATrashedTaskAsksToDeleteItFromTheTrashNeverToEraseItPermanently,dev.emassey0135.lumenna.LumennaTest#aTrashedTaskIsErasedPermanentlyFromItsMenuOnlyAfterSayingWhatThatTakes,dev.emassey0135.lumenna.LargeTextTest"
    runs-on: ubuntu-24.04
    # The full suites report; the smoke set blocks.
    continue-on-error: ${{ matrix.blocking != true }}
    # A full suite runs on master alone (`changes`): each of its steps is skipped on a
    # branch, and only the smoke set runs there.
    env:
      WANTED: ${{ matrix.blocking == true || needs.changes.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@v5
        if: env.WANTED == 'true'
        with:
          sparse-checkout: apps/android/run-instrumented-tests.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: env.WANTED == 'true'
        with:
          name: android-apks
          path: apps/android
      - name: KVM for the emulator
        if: env.WANTED == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests, on an x86_64 emulator
        if: env.WANTED == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 36, not 37: every 37 image (37.0, 37.1, 37.2) aborted its display
          # server on the Linux software renderer as the tests began ("Assertion failed:
          # !rcEnc->featureInfo()->hasReadColorBufferDma"), and the instrumentation said
          # "System has crashed". Guest rendering, ANGLE, GLDMA off and three-button
          # navigation changed nothing; on a Mac, 37 runs. The app still targets 37.
          api-level: "36"
          target: ${{ matrix.target || 'google_apis' }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          enable-hw-keyboard: ${{ matrix.keyboard }}
          emulator-boot-timeout: 900
          # The default data partition has no room for the app: "Requested internal only,
          # but not enough space". The RAM stays the profile's own.
          disk-size: 6000M
          working-directory: apps/android
          script: APP="${{ matrix.app || 'app' }}" TESTS="${{ matrix.tests }}" ./run-instrumented-tests.sh test-output
      - name: Screenshots at the largest font
        if: env.WANTED == 'true' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-${{ matrix.profile }}${{ matrix.blocking && '-smoke' || '' }}
          path: apps/android/test-output
          retention-days: 14
