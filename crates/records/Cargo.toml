[package]
name = "lumenna-records"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What Lumenna tells a person, as records: rows, their actions and questions, forms, and the words, built from a snapshot with no store."

[features]
# A store's errors as sentences, for the host, whose every operation reads the store.
store = ["dep:lumenna-store"]
# And a sync's, for the host's link and its Iroh endpoint.
sync = ["store", "dep:lumenna-sync"]

[dependencies]
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-store = { workspace = true, optional = true }
lumenna-sync = { path = "../sync", optional = true, default-features = false }
serde.workspace = true
thiserror.workspace = true
# The records the Crux app's view reaches, marked for Android's Kotlin (crates/ffi) and the
# web's TypeScript (apps/web/core). Unconditional: BoltFFI's scanner does not see its marker
# inside cfg_attr.
boltffi = "=0.31.1"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
