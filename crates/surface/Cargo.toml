[package]
name = "lumenna-surface"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's command surface: every operation once, typed, for every client."

[features]
# Swift and Kotlin bindings through UniFFI. Off for the CLI, which links this directly.
uniffi = ["dep:uniffi"]
# Pairing and syncing over Iroh. On for every client that syncs; off leaves a surface
# with no network code at all.
sync = ["dep:lumenna-sync", "dep:iroh", "dep:tokio", "dep:n0-future", "dep:serde_json"]
# TypeScript types for the web client, derived from these records as UniFFI derives
# Swift's: reshaping a record breaks the web build too.
wasm = ["dep:tsify", "dep:wasm-bindgen"]
# The command surface over JSON-RPC, served on stdio, a Unix socket or a named pipe: by `lum
# rpc`, the daemon, and the desktop apps while they hold this device's endpoint.
rpc = ["sync"]

[dependencies]
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-store.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
uniffi = { version = "0.32", optional = true }
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }
lumenna-sync = { path = "../sync", optional = true }
iroh = { version = "1.3", optional = true }
n0-future = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync", "macros"], optional = true }

# The blocking calls' runtime. A browser runs the async parts on its own event loop.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
