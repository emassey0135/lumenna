# Names the generated Swift code goes by, so an app imports "LumennaCore" rather than the
# name of a Rust crate. UniFFI reads this from the crate that defines the interface.
[bindings.swift]
module_name = "LumennaCore"
ffi_module_name = "LumennaCoreFFI"
ffi_module_filename = "LumennaCoreFFI"
generate_module_map = true

[bindings.kotlin]
package_name = "io.github.emassey0135.lumenna.core"
