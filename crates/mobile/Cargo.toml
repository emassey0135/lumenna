[package]
name = "lumenna-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Crux app and the device's services for the Kotlin apps, through BoltFFI."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boltffi = "=0.31.1"
crux_core = "=0.20.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
lumenna-app = { path = "../app" }
lumenna-bridge = { path = "../bridge", features = ["network"] }
lumenna-host = { workspace = true, features = ["sync"] }
lumenna-records.workspace = true

[lints]
workspace = true
