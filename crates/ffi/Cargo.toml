[package]
name = "lumenna-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI's binding generator for the surface, which the Apple apps link from crates/mobile."

[lib]
name = "lumenna_ffi"
# A static library for the Apple targets, a dynamic one for the host so that
# `uniffi-bindgen` can read the interface out of it, and an ordinary one for tests.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["network"]
bindgen = ["uniffi/cli"]
# Sync over Iroh and the command surface's socket. Every app has it but the Apple Watch's,
# which syncs through its phone over the link alone: watchOS allows no sockets.
network = ["lumenna-host/sync", "lumenna-host/rpc"]

[dependencies]
lumenna-host = { path = "../host", features = ["uniffi", "link"] }
lumenna-records = { workspace = true, features = ["uniffi"] }
uniffi = "0.32"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
