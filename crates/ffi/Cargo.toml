[package]
name = "lumenna-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Crux app and the device's services for the Kotlin apps, through BoltFFI."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["network"]
# Pairing and syncing over Iroh. Every app has it but the Apple Watch's, which syncs through its
# phone over the link alone: watchOS allows no sockets.
network = ["lumenna-bridge/network", "lumenna-host/sync"]
# The command surface over JSON-RPC, served while this device's endpoint is held: the Mac's.
rpc = ["network", "lumenna-bridge/rpc", "lumenna-host/rpc", "dep:base64", "dep:jiff", "dep:serde_json"]

[dependencies]
base64 = { version = "0.22", optional = true }
boltffi = "=0.31.1"
crux_core = "=0.20.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
lumenna-app = { path = "../app" }
lumenna-bridge = { path = "../bridge" }
lumenna-host = { workspace = true, features = ["link"] }
lumenna-records.workspace = true
jiff = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
