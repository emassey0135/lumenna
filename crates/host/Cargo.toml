[package]
name = "lumenna-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's command surface: every operation once, typed, for every client."

[features]
# Pairing and syncing over Iroh. On for every client that syncs; off leaves a surface
# with no network code at all.
# The watch's link to its phone, which needs no network of its own.
link = ["dep:lumenna-sync", "lumenna-records/sync"]
sync = ["link", "lumenna-sync/network", "dep:iroh", "dep:tokio", "dep:n0-future", "dep:serde_json"]
# The command surface over JSON-RPC, served on stdio, a Unix socket or a named pipe: by `lum
# rpc`, the daemon, and the desktop apps while they hold this device's endpoint.
rpc = ["sync"]

[dependencies]
directories.workspace = true
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-records = { workspace = true, features = ["store"] }
lumenna-store.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
lumenna-sync = { path = "../sync", optional = true, default-features = false }
iroh = { version = "1.3", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring"], optional = true }
n0-future = { version = "0.3", optional = true }
tokio = { version = "1", features = ["sync", "macros"], optional = true }

# The blocking calls' runtime. A browser runs the async parts on its own event loop.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# Reading the named pipe's security back, in tests/pipe.rs.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[lints]
workspace = true
