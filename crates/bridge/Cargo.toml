[package]
name = "lumenna-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The app beside its store: the store's effects answered as Crux middleware, for every shell that runs the app in the same process as its store."

[features]
# The network answered natively, over the host's sync on threads: for the apps that run the app
# in a process of their own. A browser answers it on its event loop instead.
network = ["lumenna-host/sync"]
# The command surface served at the profile's address while the network holds the device's
# endpoint, as the daemon would: for a resident desktop app (the Mac's), so Emacs and the
# BTSpeak app reach it.
rpc = ["network", "lumenna-host/rpc"]

[dependencies]
crux_core = "=0.20.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
jiff.workspace = true
lumenna-app = { path = "../app" }
lumenna-host = { workspace = true, features = ["link"] }
lumenna-records.workspace = true
lumenna-store.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
