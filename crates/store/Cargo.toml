[package]
name = "lumenna-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Automerge documents and their SQLite change store."

[dependencies]
automerge.workspace = true
jiff.workspace = true
lumenna-core = { workspace = true, features = ["serde"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

# In the browser, randomness and the clock come from JavaScript; elsewhere these
# features are not wanted.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
jiff = { workspace = true, features = ["js"] }
# Automerge's actor identifiers.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
