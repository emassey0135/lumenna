[package]
name = "lumenna-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Peer-to-peer sync between one person's devices: Automerge over Iroh, and pairing."

[dependencies]
blake3 = "1"
getrandom = "0.3"
iroh = "1.3"
lumenna-core.workspace = true
lumenna-store.workspace = true
n0-future = "0.3"
pgp-words = "1.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

# Local discovery by standard DNS-SD (§7). Apple platforms use the system's own responder
# through dns_sd, which on iOS needs no multicast entitlement; everything else uses this.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mdns-sd = "0.21"

[dev-dependencies]
jiff.workspace = true
tempfile.workspace = true

[lints]
workspace = true
