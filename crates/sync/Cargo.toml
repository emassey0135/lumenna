[package]
name = "lumenna-sync"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Peer-to-peer sync between one person's devices: Automerge over Iroh, and pairing."

[dependencies]
blake3 = "1"
getrandom = "0.3"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
lumenna-core.workspace = true
lumenna-store.workspace = true
n0-future = "0.3"
pgp-words = "1.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }

[dev-dependencies]
jiff.workspace = true
tempfile.workspace = true

[lints]
workspace = true
