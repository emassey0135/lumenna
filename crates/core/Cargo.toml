[package]
name = "lumenna-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna domain model, queries, and scheduling. No I/O."

[features]
# Serialization for the model and for edits. `store` turns it on to keep the undo history;
# a client that never persists an edit can leave it off.
serde = ["dep:serde", "jiff/serde", "uuid/serde"]

[dependencies]
chrono.workspace = true
serde = { workspace = true, optional = true }
jiff.workspace = true
rrule.workspace = true
uuid.workspace = true
thiserror.workspace = true

# In the browser, randomness and the clock come from JavaScript; elsewhere these
# features are not wanted.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
jiff = { workspace = true, features = ["js"] }
chrono = { workspace = true, features = ["wasmbind"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
