[package]
name = "lumenna-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What the apps that link the surface directly decide alike: how rows are worded, flat rows as a tree, the sidebar's places."

[dependencies]
directories.workspace = true
jiff.workspace = true
lumenna-surface = { path = "../surface" }
serde.workspace = true
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }

[features]
# TypeScript types for the web client, which shares these places and this wording.
wasm = ["dep:tsify", "dep:wasm-bindgen", "lumenna-surface/wasm"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
