[package]
name = "lumenna-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "What the apps that link the surface directly decide alike: how rows are worded, flat rows as a tree, the sidebar's places."

[features]
# The app's view worded line by line (`lines`), for the shells that draw the Crux app.
app = ["dep:lumenna-app"]

[dependencies]
boltffi = "=0.31.1"
lumenna-app = { path = "../app", optional = true }
lumenna-records.workspace = true
directories.workspace = true
jiff.workspace = true
lumenna-host = { path = "../host" }
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
