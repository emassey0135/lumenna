[package]
name = "lumenna-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lumenna's screens as a Crux app: what is open, what is in hand, what to say, as view models; every write an effect."

[features]
# TypeScript types for the web client's view models and events.
wasm = ["dep:tsify", "dep:wasm-bindgen", "lumenna-records/wasm"]

[dependencies]
# The view model and events marked for the Kotlin apps (crates/mobile).
boltffi = "=0.31.1"
crux_core = "0.20.0"
jiff.workspace = true
lumenna-core.workspace = true
lumenna-parse.workspace = true
lumenna-records.workspace = true
serde.workspace = true
serde_bytes = "0.11"
tsify = { version = "0.5", optional = true, default-features = false, features = ["js"] }
wasm-bindgen = { version = "0.2", optional = true }

[lints]
workspace = true
